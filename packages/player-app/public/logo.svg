<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Aura -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5A100" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#0B1426" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#060D1A" stop-opacity="1"/>
    </radialGradient>

    <!-- Metallic Gold Outer Ring Gradient -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="25%" stop-color="#F5C026"/>
      <stop offset="50%" stop-color="#D48800"/>
      <stop offset="75%" stop-color="#FAD055"/>
      <stop offset="100%" stop-color="#8C5300"/>
    </linearGradient>

    <!-- Inner Core Sphere Gradient -->
    <radialGradient id="sphereGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#243B6B"/>
      <stop offset="45%" stop-color="#0F1F3D"/>
      <stop offset="85%" stop-color="#081020"/>
      <stop offset="100%" stop-color="#03070E"/>
    </radialGradient>

    <!-- Gold Text & Crown Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFF0BA"/>
      <stop offset="65%" stop-color="#E5A100"/>
      <stop offset="100%" stop-color="#B37400"/>
    </linearGradient>

    <!-- Gloss Specular Highlight -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#E5A100" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Background Container -->
  <rect width="500" height="500" rx="100" fill="url(#bgGlow)" />

  <!-- Orbiting Ray Lines -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#goldRing)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />
  <circle cx="250" cy="250" r="195" fill="none" stroke="#E5A100" stroke-width="0.75" opacity="0.25" />

  <!-- 3D Outer Gold Bezel -->
  <circle cx="250" cy="250" r="180" fill="url(#goldRing)" filter="url(#shadow)" />
  <circle cx="250" cy="250" r="168" fill="#0B1426" stroke="#5C3A00" stroke-width="2" />
  
  <!-- Deep Blue Core Sphere -->
  <circle cx="250" cy="250" r="162" fill="url(#sphereGrad)" />

  <!-- Gloss Top Arc Highlight -->
  <path d="M 120 210 C 140 130, 360 130, 380 210 C 330 160, 170 160, 120 210 Z" fill="url(#gloss)" />

  <!-- 5-Pointed Mini Star Accents -->
  <g fill="url(#goldRing)" opacity="0.9">
    <polygon points="125,250 128,256 135,256 130,260 132,267 125,263 118,267 120,260 115,256 122,256" />
    <polygon points="375,250 378,256 385,256 380,260 382,267 375,263 368,267 370,260 365,256 372,256" />
  </g>

  <!-- Crown Icon on Top -->
  <g transform="translate(250, 155)" filter="url(#goldGlow)">
    <path d="M -42 12 L -50 -18 L -20 -2 L 0 -26 L 20 -2 L 50 -18 L 42 12 Z" fill="url(#goldText)" />
    <!-- Crown Jewels -->
    <circle cx="-50" cy="-18" r="3.5" fill="#FFF" />
    <circle cx="0" cy="-26" r="4.5" fill="#FFF" />
    <circle cx="50" cy="-18" r="3.5" fill="#FFF" />
    <circle cx="-20" cy="-2" r="2.5" fill="#00C853" />
    <circle cx="20" cy="-2" r="2.5" fill="#00C853" />
  </g>

  <!-- Central Typography: SUPER -->
  <text x="250" y="215" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="9" 
        fill="#FFFFFF" 
        opacity="0.95"
        style="text-transform: uppercase;">
    SUPER
  </text>

  <!-- Central Typography: BINGO -->
  <text x="250" y="285" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="4" 
        fill="url(#goldText)" 
        filter="url(#goldGlow)">
    BINGO
  </text>

  <!-- Subtitle Ribbon: ETHIOPIA -->
  <g transform="translate(250, 330)">
    <rect x="-95" y="-14" width="190" height="28" rx="14" fill="rgba(229,161,0,0.15)" stroke="url(#goldRing)" stroke-width="1.2" />
    <text x="0" y="5" 
          text-anchor="middle" 
          font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
          font-size="12" 
          font-weight="800" 
          letter-spacing="4" 
          fill="#FFF3C4">
      PREMIER ARENA
    </text>
  </g>

  <!-- Bottom Accent Dots (Colors of B-I-N-G-O) -->
  <g transform="translate(250, 380)">
    <circle cx="-36" cy="0" r="4" fill="#2563eb" />
    <circle cx="-18" cy="0" r="4" fill="#dc2626" />
    <circle cx="0" cy="0" r="4.5" fill="#059669" />
    <circle cx="18" cy="0" r="4" fill="#7c3aed" />
    <circle cx="36" cy="0" r="4" fill="#ea580c" />
  </g>
</svg>
